name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set Version in Manifest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi
          sed -i "s/Version=\"[0-9.]*\"/Version=\"${VERSION}\"/" src/Mo/Package.appxmanifest

      - name: Restore
        run: dotnet restore src/Mo/Mo.csproj -p:Platform=${{ matrix.platform }}

      # ZIP: the publish the local release script runs, so CI ships identical binaries.
      # Do not add PublishTrimmed. Nothing trims locally, and TreatWarningsAsErrors
      # turns the SDK and WinRT trim warnings into errors (IL2104).
      - name: Publish (portable)
        run: dotnet publish src/Mo/Mo.csproj -c Release -p:Platform=${{ matrix.platform }} -p:PublishProfile=win-${{ matrix.platform }}.pubxml -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false -o publish/${{ matrix.platform }} --nologo
        timeout-minutes: 15

      - name: Create ZIP
        run: Compress-Archive -Path publish/${{ matrix.platform }}/* -DestinationPath Mo-${{ github.ref_name }}-${{ matrix.platform }}.zip

      # MSIX — VS MSBuild (has System.Security.Permissions)
      - name: Build MSIX (unsigned)
        run: msbuild src/Mo/Mo.csproj /restore /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false /p:AppxPackageDir=msix-unsigned/

      - name: Rename unsigned MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -notmatch "msix-signed" } | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName "Mo-${{ github.ref_name }}-${{ matrix.platform }}-unsigned.msix"
            Write-Host "Found: $($msix.FullName)"
          } else {
            Write-Host "No unsigned MSIX found"
          }

      - name: Build and sign MSIX
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          msbuild src/Mo/Mo.csproj /restore /p:Configuration=Release /p:Platform=${{ matrix.platform }} `
            /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=$certPath `
            /p:PackageCertificatePassword=$env:SIGNING_CERT_PASSWORD `
            /p:AppxPackageSigningTimestampServerUrl=http://timestamp.digicert.com `
            /p:AppxPackageSigningTimestampDigestAlgorithm=SHA512 `
            /p:AppxPackageDir=msix-signed/

          Remove-Item $certPath -Force

      - name: Rename signed MSIX
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          $msix = Get-ChildItem -Path . -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "unsigned" -and $_.DirectoryName -match "msix-signed" } | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName "Mo-${{ github.ref_name }}-${{ matrix.platform }}.msix"
            Write-Host "Found: $($msix.FullName)"
          } else {
            Write-Host "No signed MSIX found"
          }

      # Installer: the release format users actually install (installer/Mo.iss).
      # x64 only: the script sets ArchitecturesAllowed=x64compatible.
      - name: Locate Inno Setup
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup not found and could not be installed" }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build installer
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "$env:ISCC" /DMoVersion=$version `
            /DMoSourceDir="$PWD\publish\x64" `
            /DMoOutputDir="$PWD\artifacts" `
            installer\Mo.iss
          Get-ChildItem artifacts\*.exe | ForEach-Object { Write-Host $_.Name }

      # The Korean notes live in the annotated tag, so the release body matches
      # what `git show <tag>` says.
      - name: Release notes from the tag message
        shell: bash
        run: |
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Mo ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            Mo-${{ github.ref_name }}-${{ matrix.platform }}.zip
            Mo-${{ github.ref_name }}-${{ matrix.platform }}-unsigned.msix
            Mo-${{ github.ref_name }}-${{ matrix.platform }}.msix
            artifacts/Mo-*-Setup.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
